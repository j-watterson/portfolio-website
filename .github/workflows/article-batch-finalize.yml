name: Finalize writing batch
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-article-pipeline
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Collect and validate article results
        id: finalize
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run article-batch:finalize -- --auto-review
      - name: Check whether the last deployment needs a retry
        id: deployed
        if: vars.DEPLOY_TO_CLOUDFLARE == 'true' && steps.finalize.outputs.outcome == 'noop'
        run: |
          if npm run verify:writing -- --base-url=https://jwatterson.com; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build new published content
        id: build
        if: (steps.finalize.outputs.outcome == 'finalized' && steps.finalize.outputs.published_count != '0') || steps.deployed.outputs.retry == 'true'
        run: |
          npm ci
          npm run validate:topics
          npm run test:articles
          npm run typecheck
          npm run build
      - name: Verify published writing routes
        if: steps.build.outcome == 'success'
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/writing-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/writing > /dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat /tmp/writing-preview.log; exit 1; fi
            sleep 1
          done
          npm run verify:writing -- --base-url=http://127.0.0.1:8787
      - name: Commit article and queue state
        id: commit
        if: steps.finalize.outputs.state_written == 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped')
        run: |
          git add content/articles.json scripts/topic-concepts.csv generated/weekly/ generated/article-batch-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish portfolio writing batch"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare when explicitly configured
        if: vars.DEPLOY_TO_CLOUDFLARE == 'true' && steps.build.outcome == 'success' && (steps.commit.outputs.pushed == 'true' || steps.deployed.outputs.retry == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify articles reached the live site
        if: (steps.commit.outputs.pushed == 'true' && steps.build.outcome == 'success') || steps.deployed.outputs.retry == 'true'
        run: npm run verify:writing -- --base-url=https://jwatterson.com --attempts=40
      - name: Report batch failure
        if: steps.finalize.outcome == 'failure'
        run: exit 1
      - name: Preserve recovery files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writing-finalization-recovery
          path: |
            generated/article-batch-state.json
            generated/weekly/
            content/articles.json
            scripts/topic-concepts.csv
          if-no-files-found: ignore
