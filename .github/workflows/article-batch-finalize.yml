name: Finalize writing batch
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-article-pipeline
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Collect and validate article results
        id: finalize
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run article-batch:finalize
      - name: Build new published content
        id: build
        if: steps.finalize.outputs.outcome == 'finalized' && steps.finalize.outputs.published_count != '0'
        run: |
          npm ci
          npm run validate:topics
          npm run typecheck
          npm run build
      - name: Commit article and queue state
        id: commit
        if: steps.finalize.outputs.state_written == 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped')
        run: |
          git add content/articles.json scripts/topic-concepts.csv generated/weekly/ generated/article-batch-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish portfolio writing batch"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare when explicitly configured
        if: vars.DEPLOY_TO_CLOUDFLARE == 'true' && steps.commit.outputs.pushed == 'true' && steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Report batch failure
        if: steps.finalize.outcome == 'failure'
        run: exit 1
      - name: Preserve recovery files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writing-finalization-recovery
          path: |
            generated/article-batch-state.json
            generated/weekly/
            content/articles.json
            scripts/topic-concepts.csv
          if-no-files-found: ignore
