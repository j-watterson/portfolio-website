name: Deploy portfolio to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/**'
      - 'public/**'
      - 'package*.json'
      - '*config*'
      - 'wrangler.jsonc'
      - 'scripts/copy-hosting-metadata.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
# Shared with publication to prevent an older build deploying over a newer article batch.
concurrency:
  group: portfolio-article-pipeline
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_TO_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:topics
      - run: npm run test:articles
      - run: npm run typecheck
      - run: npm run build
      - name: Verify published writing routes
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/writing-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/writing > /dev/null; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat /tmp/writing-preview.log; exit 1; fi
            sleep 1
          done
          npm run verify:writing -- --base-url=http://127.0.0.1:8787
      - name: Deploy current main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify live writing after deployment
        run: npm run verify:writing -- --base-url=https://jwatterson.com --attempts=12
