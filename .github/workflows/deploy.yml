name: Deploy portfolio to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'content/**'
      - 'public/**'
      - 'package*.json'
      - '*config*'
      - 'wrangler.jsonc'
      - 'scripts/copy-hosting-metadata.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
# Shared with publication to prevent an older build deploying over a newer article batch.
concurrency:
  group: portfolio-article-pipeline
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_TO_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:topics
      - run: npm run test:articles
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy current main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
